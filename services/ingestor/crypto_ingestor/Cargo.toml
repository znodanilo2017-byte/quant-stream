[package]
name = "crypto_ingestor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Асинхронний двигун
tokio = { version = "1", features = ["full"] }

# Вебсокети
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3" 

# JSON та Серіалізація
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"

# Kafka (важливо мати feature cmake-build або dynamic-linking)
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Логи та змінні
dotenv = "0.15"
log = "0.4"
env_logger = "0.10"