name: QuantStream CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env configuration
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          sleep 30

      - name: Check running containers
        run: |
          docker ps
          docker compose ps

      - name: Verify expected services are running
        run: |
          docker inspect --format='{{.State.Running}}' redpanda
          docker inspect --format='{{.State.Running}}' timescaledb
          docker inspect --format='{{.State.Running}}' rust_ingestor
          docker inspect --format='{{.State.Running}}' zscore_processor
          docker inspect --format='{{.State.Running}}' grafana

      - name: Check Grafana health endpoint
        run: curl --fail http://localhost:3000/api/health

      - name: Validate provisioned stack
        run: bash ./scripts/validate_stack.sh